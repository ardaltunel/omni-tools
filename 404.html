<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <script>
        (() => {
            // Statik hostlar SPA yolunu fiziksel dosya gibi arar. Geçerli tek-segment
            // araç yollarını ana uygulamaya iletip index.js router'ının yeniden kurmasını sağlarız.
            const projectPath = window.location.hostname.endsWith(".github.io")
                ? (window.location.pathname.match(/^\/[^/]+\/?/)?.[0] || "/")
                : "/";
            const requestedRoute = window.location.pathname
                .slice(projectPath.length)
                .replace(/^\/+|\/+$/g, "");

            // Gerçek eksik dosyalar ve daha derin bilinmeyen yollar 404 ekranında kalır.
            if (!requestedRoute || requestedRoute.includes("/") || requestedRoute.includes(".")) return;

            const appUrl = new URL(projectPath, window.location.origin);
            appUrl.searchParams.set("tool", requestedRoute);
            window.location.replace(appUrl.href);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#101114">
    <meta name="robots" content="noindex">
    <title>Sayfa Bulunamadı | Omni Tools</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #101114;
            --panel: #191b20;
            --text: #f6f7fb;
            --muted: #aab0bf;
            --line: #303542;
            --accent: #18a999;
            --accent-light: #dffefb;
        }

        * { box-sizing: border-box; }
        html { min-height: 100%; background: var(--bg); }

        body {
            display: grid;
            min-height: 100vh;
            place-items: center;
            margin: 0;
            padding: 24px;
            background:
                radial-gradient(circle at 17% 14%, rgba(24, 169, 153, .17), transparent 27rem),
                radial-gradient(circle at 87% 86%, rgba(244, 211, 94, .12), transparent 23rem),
                var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #ambient-canvas {
            position: fixed;
            z-index: -1;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .orb {
            position: fixed;
            z-index: -1;
            width: 13rem;
            aspect-ratio: 1;
            border: 1px solid rgba(223, 254, 251, .09);
            border-radius: 50%;
        }

        .orb-one { top: -5rem; right: 8vw; }
        .orb-two { bottom: -8rem; left: 7vw; width: 18rem; }

        .error-card {
            display: flex;
            width: min(100%, 590px);
            flex-direction: column;
            align-items: center;
            padding: clamp(38px, 5vw, 52px);
            border: 1px solid var(--line);
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(29, 32, 38, .93), rgba(25, 27, 32, .88));
            box-shadow: 0 24px 70px rgba(0, 0, 0, .28), inset 0 1px rgba(255, 255, 255, .035);
            text-align: center;
            backdrop-filter: blur(16px);
        }

        .code-wrap {
            position: relative;
            display: grid;
            width: clamp(210px, 36vw, 242px);
            aspect-ratio: 1;
            place-items: center;
            margin-bottom: 30px;
        }

        .code-wrap::before {
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(24, 169, 153, .45);
            border-radius: 50%;
            box-shadow: 0 0 34px rgba(24, 169, 153, .1), inset 0 0 28px rgba(24, 169, 153, .05);
            content: "";
        }

        .code-ring {
            position: absolute;
            inset: 0;
            border: 1px dashed rgba(24, 169, 153, .46);
            border-radius: 50%;
        }

        .orbit-dot {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            transform: rotate(var(--orbit-angle, 0deg));
        }

        .orbit-dot::after {
            position: absolute;
            top: -4px;
            left: calc(50% - 4px);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f4d35e;
            box-shadow: 0 0 14px rgba(244, 211, 94, .8);
            content: "";
        }

        .code {
            position: relative;
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: center;
            color: var(--accent-light);
            font-size: clamp(4.6rem, 12vw, 5.75rem);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -.07em;
            line-height: 1;
            text-align: center;
            transform: translate(-.075em, -3px);
            text-shadow: 0 0 30px rgba(24, 169, 153, .15);
        }

        h1 {
            max-width: 18ch;
            margin: 0;
            font-size: clamp(1.7rem, 4vw, 2.2rem);
            letter-spacing: -.04em;
            line-height: 1.14;
        }

        p {
            max-width: 43ch;
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.65;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 18px;
            border: 1px solid transparent;
            border-radius: 9px;
            color: var(--text);
            font-size: .94rem;
            font-weight: 700;
            text-decoration: none;
            transition: transform .2s ease, border-color .2s ease, background .2s ease;
        }

        .button:hover { transform: translateY(-2px); }
        .button:focus-visible { outline: 3px solid rgba(223, 254, 251, .45); outline-offset: 3px; }
        .button-primary { background: var(--accent); box-shadow: 0 8px 18px rgba(24, 169, 153, .2); }
        .button-primary:hover { background: #20bbaa; }
        .button-secondary { border-color: var(--line); background: transparent; color: var(--muted); }
        .button-secondary:hover { border-color: #505968; color: var(--text); }

        @media (max-width: 460px) {
            body { padding: 16px; }
            .error-card { padding: 30px 24px; border-radius: 16px; }
            .code-wrap { margin-bottom: 24px; }
            .actions { width: 100%; flex-direction: column; }
            .button { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
        }
    </style>
</head>

<body>
    <canvas id="ambient-canvas" aria-hidden="true"></canvas>
    <div class="orb orb-one" aria-hidden="true"></div>
    <div class="orb orb-two" aria-hidden="true"></div>

    <main class="error-card">
        <div class="code-wrap" aria-hidden="true">
            <span class="code-ring"></span>
            <span id="error-code" class="code">404</span>
            <span class="orbit-dot"></span>
        </div>
        <h1>Bu sayfa rotasını kaybetmiş.</h1>
        <p>Aradığın sayfa taşınmış, silinmiş ya da hiç var olmamış olabilir. Ana sayfadan araçlara göz atabilirsin.</p>

        <div class="actions">
            <a id="home-link" class="button button-primary" href="/">Ana sayfaya dön</a>
            <a class="button button-secondary" href="javascript:history.back()">Geri dön</a>
        </div>
    </main>

    <script>
        (() => {
            const isGitHubPages = window.location.hostname.endsWith(".github.io");
            const projectPath = window.location.pathname.match(/^\/[^/]+\/?/)?.[0] || "/";
            const homeUrl = isGitHubPages ? projectPath : "/";
            const homeLink = document.getElementById("home-link");
            const errorCode = document.getElementById("error-code");
            const codeWrap = document.querySelector(".code-wrap");
            const canvas = document.getElementById("ambient-canvas");
            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            homeLink.href = homeUrl;

            if (reduceMotion) return;

            const startedAt = performance.now();
            const countDuration = 900;
            const canvasContext = canvas.getContext("2d");
            const particles = Array.from({ length: 18 }, () => ({
                x: Math.random(),
                y: Math.random(),
                radius: Math.random() * 1.5 + .5,
                speed: Math.random() * .00002 + .000008,
                phase: Math.random() * Math.PI * 2,
                alpha: Math.random() * .2 + .05
            }));

            const resizeCanvas = () => {
                const scale = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = window.innerWidth * scale;
                canvas.height = window.innerHeight * scale;
                canvasContext.setTransform(scale, 0, 0, scale, 0, 0);
            };

            const animate = (now) => {
                const elapsed = now - startedAt;
                const progress = Math.min(elapsed / countDuration, 1);
                const eased = 1 - Math.pow(1 - progress, 4);
                errorCode.textContent = Math.round(eased * 404);
                codeWrap.style.setProperty("--orbit-angle", `${(elapsed * .022) % 360}deg`);

                canvasContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
                particles.forEach((particle) => {
                    const x = particle.x * window.innerWidth + Math.sin(elapsed * particle.speed + particle.phase) * 26;
                    const y = particle.y * window.innerHeight + Math.cos(elapsed * particle.speed * .8 + particle.phase) * 18;
                    canvasContext.beginPath();
                    canvasContext.arc(x, y, particle.radius, 0, Math.PI * 2);
                    canvasContext.fillStyle = `rgba(163, 239, 229, ${particle.alpha})`;
                    canvasContext.fill();
                });

                requestAnimationFrame(animate);
            };

            resizeCanvas();
            window.addEventListener("resize", resizeCanvas, { passive: true });
            requestAnimationFrame(animate);
        })();
    </script>
</body>

</html>
