<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,follow">
    <link rel="canonical" href="../../emlak-portfoy-analizi">
    <title>Emlak Portföy Analizi | Omni Tools</title>
    <script>
        (() => {
            const segments = window.location.pathname.split("/").filter(Boolean);
            const toolsIndex = segments.lastIndexOf("tools");
            const baseSegments = toolsIndex >= 0 ? segments.slice(0, toolsIndex) : [];
            const targetPath = `/${[...baseSegments, "emlak-portfoy-analizi"].join("/")}`;
            window.location.replace(`${targetPath}${window.location.search}${window.location.hash}`);
        })();
    </script>
</head>
<body>
    <p><a href="../../emlak-portfoy-analizi">Emlak Portföy Analizi aracına gidin</a></p>
</body>
</html>
